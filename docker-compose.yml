services:

  db:
    # Pin the major version — Postgres can't start on a data directory from a different major.
    # 18+ keeps its data under /var/lib/postgresql/<major>/docker, so mount the parent directory.
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: db
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=grid
    # No published port — the app reaches the database over the compose network.
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql
    restart: always

  grid:
    image: ${DOCKER_REGISTRY-}grid
    container_name: grid
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - Mailgun__ApiKey=${MAILGUN_API_KEY}
      - AllowedHosts=${ALLOWED_HOSTS:-*}
      - ForwardedHeaders__KnownNetworks=${TRUSTED_PROXY_NETWORKS:-}
      # External login providers — leave unset to disable a provider
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - Authentication__Microsoft__ClientId=${MICROSOFT_CLIENT_ID:-}
      - Authentication__Microsoft__ClientSecret=${MICROSOFT_CLIENT_SECRET:-}
      - Authentication__Authentik__Authority=${AUTHENTIK_AUTHORITY:-}
      - Authentication__Authentik__ClientId=${AUTHENTIK_CLIENT_ID:-}
      - Authentication__Authentik__ClientSecret=${AUTHENTIK_CLIENT_SECRET:-}
    build:
      context: .
      dockerfile: GRID/Dockerfile
    ports:
      - ${GRID_BIND_ADDRESS:-127.0.0.1}:35510:8080
    volumes:
      - ${DATA_DIR:-./data}/keys:/app/keys
    depends_on:
      - db
