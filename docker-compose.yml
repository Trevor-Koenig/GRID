services:

  db:
    image: postgres:latest
    container_name: db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=grid
    ports:
      - 5432:5432
    
    restart: always

  grid:
    image: ${DOCKER_REGISTRY-}grid
    container_name: grid
    environment:
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - Mailgun__ApiKey=${MAILGUN_API_KEY}
      # External login providers — leave unset to disable a provider
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - Authentication__Microsoft__ClientId=${MICROSOFT_CLIENT_ID:-}
      - Authentication__Microsoft__ClientSecret=${MICROSOFT_CLIENT_SECRET:-}
      - Authentication__Authentik__Authority=${AUTHENTIK_AUTHORITY:-}
      - Authentication__Authentik__ClientId=${AUTHENTIK_CLIENT_ID:-}
      - Authentication__Authentik__ClientSecret=${AUTHENTIK_CLIENT_SECRET:-}
    build:
      context: .
      dockerfile: GRID/Dockerfile
    ports:
      - 35510:8080
      - 35511:8081
    volumes:
      - grid_keys:/app/keys
    depends_on:
      - db

volumes:
  grid_keys: